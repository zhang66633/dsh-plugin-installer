name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Script syntax check
        run: npm run check

      - name: Smoke (plugin imports + provider loads)
        run: npm run smoke

      - name: Unit tests
        run: npm run test

      - name: Shellcheck (scripts)
        run: shellcheck scripts/*.sh
